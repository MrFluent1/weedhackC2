name: Decode ETH Contract Domain

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: decode-eth-domain
  cancel-in-progress: true

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decode eth_call result
        run: |
          python3 scripts/decode_eth_domain.py

      - name: Commit updated domain artifacts
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add domains.log latest.json latest_payload_sha256.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update decoded ETH domain log"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare static site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p public
          cp index.html domains.log latest.json latest_payload_sha256.txt .nojekyll public/

      - name: Upload static site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
