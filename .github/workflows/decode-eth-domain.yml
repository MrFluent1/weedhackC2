name: Decode ETH Contract Domain

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: decode-eth-domain
  cancel-in-progress: true

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decode eth_call result
        run: |
          python3 scripts/decode_eth_domain.py

      - name: Commit updated domains.log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add domains.log latest.json latest_payload_sha256.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update decoded ETH domain log"
            git push
          fi
